version: '3.8'

services:
  gymaura-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymaura-backend-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./gym_db.json:/app/gym_db.json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
