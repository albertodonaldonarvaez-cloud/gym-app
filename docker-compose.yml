services:
  gymaura-db:
    image: postgres:16-alpine
    container_name: gymaura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymaura
      POSTGRES_USER: gymaura
      POSTGRES_PASSWORD: GymAuraDB2025!
    volumes:
      - gymaura_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymaura -d gymaura"]
      interval: 10s
      timeout: 5s
      retries: 5

  gymaura-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gymaura-backend-api
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gymaura:GymAuraDB2025!@gymaura-db:5432/gymaura
      - JWT_SECRET=gymaura-jwt-secret-ultra-secure-2025
    depends_on:
      gymaura-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gymaura_pgdata:
